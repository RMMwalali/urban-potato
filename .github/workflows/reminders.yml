# Sends due appointment reminders every 15 minutes.
# Vercel's Hobby plan only allows daily cron jobs, so this runs the schedule from GitHub instead.
# Add repository secrets APP_URL (e.g. https://your-app.vercel.app) and CRON_SECRET (same value as on Vercel).
name: Appointment reminders
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminders
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL / CRON_SECRET secrets not set; skipping"; exit 0; fi
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/reminders"
